<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>レミニシア 0.10 完全版</title><style>body{margin:0;background:#111827;color:#f8fafc;font-family:system-ui}header{padding:14px;background:#172554;position:sticky;top:0}nav{display:flex;gap:6px;flex-wrap:wrap}button{padding:10px;border:0;border-radius:9px;background:#334155;color:#fff}button.active{background:#7c3aed}.wrap{padding:14px;max-width:760px;margin:auto}.panel{display:none}.panel.on{display:block}.card{margin:12px 0;padding:16px;border-radius:16px;background:#1e293b}.dungeon{min-height:190px;display:flex;flex-direction:column;justify-content:end}.memory{background:radial-gradient(circle at 30% 30%,#eaffff,#69b7d5 20%,#173c68 60%,#081326)}.seal{background:radial-gradient(circle at 70% 25%,#ffe08a,#a94028 25%,#451720 62%,#180c18)}.muted{opacity:.8}</style><header><b>レミニシア 0.10 完全版</b><div class="muted">コイン <span id="coin">120</span>　拠点 Lv<span id="lv">1</span></div><nav><button data-p="home" class="active">拠点</button><button data-p="adventure">冒険</button><button data-p="tower">試練の塔</button><button data-p="育成ダンジョン">育成ダンジョン</button></nav></header><main class="wrap"><section id="home" class="panel on"><div class="card"><h2>魔法郵便局</h2><p>仲間と手紙を届け、記憶を取り戻そう。</p><button onclick="upgrade()">拠点を強化（50コイン）</button></div></section><section id="adventure" class="panel"><div class="card"><h2>冒険</h2><p>難易度を選び、遺跡へ出発します。</p><button onclick="alert('ノーマル冒険を開始')">ノーマル</button> <button onclick="alert('ハード冒険を開始')">ハード</button> <button onclick="alert('エクストラ冒険を開始')">エクストラ</button></div></section><section id="tower" class="panel"><div class="card"><h2>試練の塔</h2><p>階層を進み、特別な素材を獲得。</p><button onclick="alert('塔の挑戦を開始')">挑戦する</button></div></section><section id="育成ダンジョン" class="panel"><div class="card"><h2>育成ダンジョン</h2><p>経験値や素材を集めて仲間を育成。</p><div class="card dungeon memory"><h2>経験値ダンジョン：記憶鉱洞</h2><p>淡い青白い鉱石が記憶の光を灯す洞窟。</p><b>報酬：経験値結晶</b><br><button onclick="alert('記憶鉱洞へ出発')">挑戦する</button></div><div class="card dungeon seal"><h2>素材ダンジョン：封印洞</h2><p>赤金の鉱脈と古い郵便壁画が眠る洞窟。</p><b>報酬：封蝋鉱・古紙片</b><br><button onclick="alert('封印洞へ出発')">挑戦する</button></div></div></section></main><script>const bs=[...document.querySelectorAll('button[data-p]')];bs.forEach(b=>b.onclick=()=>{document.querySelectorAll('.panel').forEach(x=>x.classList.remove('on'));document.getElementById(b.dataset.p).classList.add('on');bs.forEach(y=>y.classList.remove('active'));b.classList.add('active')});function upgrade(){let c=+coin.textContent;if(c>=50){coin.textContent=c-50;lv.textContent=+lv.textContent+1}else alert('コイン不足')}</script></html>
